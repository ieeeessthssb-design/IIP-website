<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#39FF88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" fill="none"/>
  
  <!-- Grid pattern -->
  <g opacity="0.3" stroke="url(#grad)" stroke-width="1">
    <line x1="20" y1="20" x2="108" y2="20"/>
    <line x1="20" y1="40" x2="108" y2="40"/>
    <line x1="20" y1="60" x2="108" y2="60"/>
    <line x1="20" y1="80" x2="108" y2="80"/>
    <line x1="20" y1="100" x2="108" y2="100"/>
    <line x1="20" y1="20" x2="20" y2="108"/>
    <line x1="40" y1="20" x2="40" y2="108"/>
    <line x1="60" y1="20" x2="60" y2="108"/>
    <line x1="80" y1="20" x2="80" y2="108"/>
    <line x1="100" y1="20" x2="100" y2="108"/>
  </g>
  
  <!-- Energy nodes -->
  <circle cx="32" cy="32" r="3" fill="url(#grad)"/>
  <circle cx="96" cy="32" r="3" fill="url(#grad)"/>
  <circle cx="64" cy="64" r="4" fill="url(#grad)"/>
  <circle cx="32" cy="96" r="3" fill="url(#grad)"/>
  <circle cx="96" cy="96" r="3" fill="url(#grad)"/>
  
  <!-- Connection lines -->
  <g stroke="url(#grad)" stroke-width="1.5" opacity="0.5" fill="none">
    <line x1="32" y1="32" x2="64" y2="64"/>
    <line x1="96" y1="32" x2="64" y2="64"/>
    <line x1="32" y1="96" x2="64" y2="64"/>
    <line x1="96" y1="96" x2="64" y2="64"/>
  </g>
</svg>
