<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="personGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16A34A;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#39FF88;stop-opacity:0.2" />
    </linearGradient>
  </defs>
  
  <rect width="128" height="128" fill="url(#personGrad)"/>
  
  <!-- Person silhouette -->
  <g fill="#39FF88" opacity="0.6">
    <!-- Head -->
    <circle cx="64" cy="32" r="14"/>
    <!-- Body -->
    <rect x="54" y="48" width="20" height="28" rx="4"/>
    <!-- Left arm -->
    <rect x="40" y="52" width="14" height="8" rx="4"/>
    <!-- Right arm -->
    <rect x="74" y="52" width="14" height="8" rx="4"/>
    <!-- Left leg -->
    <rect x="54" y="78" width="6" height="28" rx="3"/>
    <!-- Right leg -->
    <rect x="68" y="78" width="6" height="28" rx="3"/>
  </g>
  
  <!-- Grid overlay -->
  <g stroke="#39FF88" stroke-width="0.5" opacity="0.2">
    <line x1="0" y1="0" x2="128" y2="0"/>
    <line x1="0" y1="16" x2="128" y2="16"/>
    <line x1="0" y1="32" x2="128" y2="32"/>
    <line x1="0" y1="48" x2="128" y2="48"/>
    <line x1="0" y1="64" x2="128" y2="64"/>
    <line x1="0" y1="80" x2="128" y2="80"/>
    <line x1="0" y1="96" x2="128" y2="96"/>
    <line x1="0" y1="112" x2="128" y2="112"/>
  </g>
</svg>
