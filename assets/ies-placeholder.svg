<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <rect width="128" height="128" fill="none"/>
  
  <!-- Industrial Electronics - Circuit/Control theme -->
  <g fill="none" stroke="#39FF88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Circuit board trace -->
    <path d="M 30 64 L 50 64 L 50 45 L 70 45 L 70 64 L 90 64 L 90 80 L 70 80 L 70 100 L 50 100 L 50 80 L 30 80 Z"/>
    
    <!-- Connection nodes -->
    <circle cx="30" cy="64" r="4" fill="#39FF88" opacity="0.7"/>
    <circle cx="50" cy="45" r="3" fill="#39FF88" opacity="0.7"/>
    <circle cx="70" cy="45" r="3" fill="#39FF88" opacity="0.7"/>
    <circle cx="90" cy="64" r="4" fill="#39FF88" opacity="0.7"/>
    <circle cx="70" cy="100" r="3" fill="#39FF88" opacity="0.7"/>
    <circle cx="50" cy="100" r="3" fill="#39FF88" opacity="0.7"/>
    <circle cx="30" cy="80" r="4" fill="#39FF88" opacity="0.7"/>
    <circle cx="90" cy="80" r="4" fill="#39FF88" opacity="0.7"/>
    
    <!-- Center control unit -->
    <rect x="58" y="58" width="12" height="12" rx="2"/>
    
    <!-- Micro traces (smaller connections) -->
    <path d="M 35 30 L 45 35" opacity="0.4"/>
    <path d="M 85 30 L 75 35" opacity="0.4"/>
    <path d="M 35 105 L 45 100" opacity="0.4"/>
    <path d="M 85 105 L 75 100" opacity="0.4"/>
  </g>
</svg>
