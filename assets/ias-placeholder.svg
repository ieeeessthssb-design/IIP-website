<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <rect width="128" height="128" fill="none"/>
  
  <!-- Industry Applications - Factory/Industrial theme -->
  <g fill="none" stroke="#39FF88" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- Building outline -->
    <rect x="24" y="40" width="80" height="60" rx="4"/>
    
    <!-- Chimneys -->
    <rect x="35" y="20" width="6" height="20"/>
    <rect x="55" y="15" width="6" height="25"/>
    <rect x="75" y="22" width="6" height="18"/>
    
    <!-- Windows (industrial grid) -->
    <g opacity="0.6">
      <rect x="32" y="48" width="8" height="8"/>
      <rect x="48" y="48" width="8" height="8"/>
      <rect x="64" y="48" width="8" height="8"/>
      <rect x="80" y="48" width="8" height="8"/>
      <rect x="32" y="65" width="8" height="8"/>
      <rect x="48" y="65" width="8" height="8"/>
      <rect x="64" y="65" width="8" height="8"/>
      <rect x="80" y="65" width="8" height="8"/>
    </g>
    
    <!-- Door -->
    <rect x="60" y="80" width="8" height="20" rx="1"/>
    
    <!-- Gears/mechanics -->
    <circle cx="42" cy="105" r="4" opacity="0.5"/>
    <circle cx="58" cy="105" r="4" opacity="0.5"/>
    <circle cx="74" cy="105" r="4" opacity="0.5"/>
  </g>
</svg>
